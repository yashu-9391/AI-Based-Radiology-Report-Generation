# Configuration for AI-Based Preliminary Radiology Report Generation Framework

project:
  name: "AI Preliminary Radiology Report Framework"
  version: "1.0.0"
  seed: 42
  device: "auto" # "auto", "cuda", or "cpu"

data:
  chexpert_path: "datasets/chexpert"
  iu_xray_path: "datasets/iu_xray"
  additional_datasets_path: "datasets/additional_datasets"
  image_size: 224
  channels: 3
  num_workers: 2
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

observations:
  - "Enlarged Cardiomediastinum"
  - "Cardiomegaly"
  - "Lung Opacity"
  - "Lung Lesion"
  - "Edema"
  - "Consolidation"
  - "Pneumonia"
  - "Atelectasis"
  - "Pneumothorax"
  - "Pleural Effusion"
  - "Pleural Other"
  - "Fracture"
  - "Support Devices"
  - "No Finding"

uncertain_label_strategy: "u-ignore" # Options: "u-ignore", "u-zero", "u-one"

model:
  architecture: "densenet121" # Options: "densenet121", "resnet50", "efficientnet_b0"
  pretrained: true
  num_classes: 14
  dropout: 0.2

training:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
  loss_function: "weighted_bce" # Options: "bce", "weighted_bce", "focal"
  focal_gamma: 2.0
  scheduler: "reduce_on_plateau"
  scheduler_patience: 2
  early_stopping_patience: 5

classification:
  threshold: 0.20
  use_youden_j: true
  optimal_thresholds:
    Enlarged Cardiomediastinum: 0.18
    Cardiomegaly: 0.22
    Lung Opacity: 0.20
    Lung Lesion: 0.15
    Edema: 0.20
    Consolidation: 0.15
    Pneumonia: 0.08
    Atelectasis: 0.20
    Pneumothorax: 0.18
    Pleural Effusion: 0.22
    Pleural Other: 0.15
    Fracture: 0.15
    Support Devices: 0.30
    No Finding: 0.35

retrieval:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 3
  vector_db_path: "checkpoints/faiss_index.bin"
  corpus_metadata_path: "checkpoints/report_corpus.pkl"

rag:
  mode: "single_agent" # Options: "single_agent", "multi_agent"

report_generation:
  llm_provider: "rule_based" # Options: "rule_based", "huggingface", "ollama", "openai"
  model_name: "BioMistral/BioMistral-7B"
  max_new_tokens: 300
  temperature: 0.3

paths:
  checkpoints_dir: "checkpoints"
  models_dir: "models"
  results_dir: "results"
  logs_dir: "logs"
  project_report_dir: "project_report"
